# Tak för systemd-journalen på en Security Harbor-brandvägg.
#
# Bakgrund: /etc/systemd/journald.conf hade SystemMaxUse=8G, och journalen låg
# på 2 GB efter fyra dygns drift (mätt 2026-08-27). Brandväggens nftables-logg
# ligger i kärnloggen och skriver i storleksordningen hundratusen rader per
# dygn, så journalen växer snabbt och obönhörligt.
#
# 512 MB räcker för flera dygns felsökning och gör samtidigt varje
# journalctl-läsning snabb — Loggningsvyn i GUI:t frågar journalen direkt.
[Journal]
SystemMaxUse=512M
SystemKeepFree=1G
SystemMaxFileSize=64M
MaxRetentionSec=2week
