# Storleksbaserad rotation för Suricatas loggar.
#
# Distributionens /etc/logrotate.d/suricata saknar frekvensdirektiv och ärver
# därför global "weekly" med rotate 14 — alltså fjorton veckors loggar. Mätt
# 2026-08-27 på en skarp installation: eve.json 1,47 GB, stats.log 393 MB och
# fast.log 77 MB efter fyra dygn, med nästa rotation flera dygn bort.
#
# OBS: logrotate avvisar dubbletter ("duplicate log entry") om två filer
# matchar samma sökväg, så den här ERSÄTTER /etc/logrotate.d/suricata i
# stället för att läggas bredvid. install.sh sparar originalet en gång till
# /etc/logrotate.d/suricata.security-harbor-orig.
#
# stats.log (393 MB vid mätningen) begränsas här snarare än stängs av — att
# stänga av den kräver redigering av suricata.yaml, och agenten rör med flit
# bara af-packet-raden i den filen.
/var/log/suricata/*.log
/var/log/suricata/*.json
{
    su root root
    daily
    size 100M
    rotate 5
    compress
    missingok
    notifempty
    copytruncate
    sharedscripts
}
